openapi: 3.1.0
info:
  title: SDKWork Models App API
  version: 0.1.0
  description: Intelligence catalog app read API owned by sdkwork-models.
servers:
  - url: /app/v3/api
paths:
  /ai/model_vendors:
    get:
      operationId: modelVendors.list
      summary: List model vendors
      responses:
        "200":
          description: Vendor list
  /ai/models:
    get:
      operationId: models.list
      summary: List models with pricing context
      responses:
        "200":
          description: Model catalog page
  /ai/model_rankings:
    get:
      operationId: modelRankings.list
      summary: List model rankings
      responses:
        "200":
          description: Rankings snapshot
