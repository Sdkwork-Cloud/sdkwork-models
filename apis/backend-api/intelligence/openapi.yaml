openapi: 3.1.0
info:
  title: SDKWork Models Backend API
  version: 0.1.0
  description: Intelligence catalog admin API owned by sdkwork-models.
servers:
  - url: /backend/v3/api
paths:
  /ai/model_vendors:
    get:
      operationId: modelVendors.list
      summary: List model vendors
      responses:
        "200":
          description: Vendor list
    post:
      operationId: modelVendors.create
      summary: Create model vendor
      responses:
        "200":
          description: Created vendor
  /ai/models:
    get:
      operationId: models.list
      summary: List models
      responses:
        "200":
          description: Model list
    post:
      operationId: models.create
      summary: Create model
      responses:
        "200":
          description: Created model
  /ai/models/refresh:
    post:
      operationId: models.refresh
      summary: Sync catalog from sdkwork-models JSON
      responses:
        "200":
          description: Sync report
  /ai/models/{modelId}:
    patch:
      operationId: models.update
      summary: Update model
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated model
    delete:
      operationId: models.delete
      summary: Delete model
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /ai/model_mappings:
    get:
      operationId: modelMappings.list
      summary: List model mapping rules
      responses:
        "200":
          description: Mapping list
    post:
      operationId: modelMappings.create
      summary: Create mapping rule
      responses:
        "200":
          description: Created mapping
  /ai/model_mappings/resolve:
    post:
      operationId: modelMappings.resolve.create
      summary: Resolve model mapping
      responses:
        "200":
          description: Resolve result
  /ai/model_mappings/{mappingId}:
    patch:
      operationId: modelMappings.update
      summary: Update mapping rule
      parameters:
        - name: mappingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated mapping
    delete:
      operationId: modelMappings.delete
      summary: Delete mapping rule
      parameters:
        - name: mappingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted mapping
  /ai/model_rankings:
    get:
      operationId: modelRankings.list
      summary: List model rankings
      responses:
        "200":
          description: Rankings list
  /ai/model_rankings/status:
    get:
      operationId: modelRankings.status.retrieve
      summary: Rankings refresh status
      responses:
        "200":
          description: Status
  /ai/model_rankings/jobs:
    get:
      operationId: modelRankings.jobs.list
      summary: Rankings refresh jobs
      responses:
        "200":
          description: Job history
  /ai/model_rankings/refresh:
    post:
      operationId: modelRankings.refresh
      summary: Trigger rankings refresh
      responses:
        "200":
          description: Refresh outcome
