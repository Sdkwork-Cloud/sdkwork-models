[package]
name = "sdkwork-converters"
version = "0.1.0"
edition = "2021"
description = "SDKWork Client API Protocol Converters"
license = "MIT"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
regex = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
