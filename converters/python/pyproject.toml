[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdkwork-converters"
version = "0.1.0"
description = "SDKWork Client API Protocol Converters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
