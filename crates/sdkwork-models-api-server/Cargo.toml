[package]
name = "sdkwork-models-api-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SDKWork canonical intelligence catalog HTTP route composition for local/private deployments."

[lib]
path = "src/lib.rs"

[[bin]]
name = "sdkwork-models-api-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
dotenvy = "0.15"
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing.workspace = true
tracing-subscriber = "0.3"
sdkwork-id-core.workspace = true
sdkwork_models_catalog_service.workspace = true
sdkwork_models_catalog_repository_sqlx.workspace = true
sdkwork_models_contract_service.workspace = true
sdkwork-models-database-host = { path = "../sdkwork-models-database-host" }
sdkwork-models = { path = "../../sdks/sdkwork-models-sdk/sdkwork-models-sdk-rust" }
sdkwork_routes_models_catalog_app_api.workspace = true
sdkwork_routes_models_catalog_backend_api.workspace = true
sdkwork-iam-web-adapter.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-web-core.workspace = true
sdkwork-database-sqlx = { path = "../../../sdkwork-database/crates/sdkwork-database-sqlx" }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "sdkwork-models-standalone-gateway"
path = "src/main.rs"
