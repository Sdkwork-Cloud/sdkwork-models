[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdkwork-models"
version = "0.1.0"
description = "Sdkwork vendor-scoped AI model catalog SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sdkwork Cloud" }]

[tool.setuptools.packages.find]
include = ["sdkwork_models*"]
